name: Publish CLI to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish llm-game-arena
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: test "v$(node -p \"require('./apps/player-cli/package.json').version\")" = "$GITHUB_REF_NAME"

      - name: Validate workspace
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Publish package
        run: npm publish --workspace llm-game-arena --access public
